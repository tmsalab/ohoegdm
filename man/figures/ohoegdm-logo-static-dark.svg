<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" role="img" aria-labelledby="ohoegdmdTitle ohoegdmdDesc">
<title id="ohoegdmdTitle">ohoegdm</title>
<desc id="ohoegdmdDesc">Hexagonal logo for the R package ohoegdm: the model drawn as a wheel. At the hub is a solid node marked theta, the general trait, wired to three solid squares around it, the binary attributes. Spokes run from the attributes out to twelve items on the rim, one wherever the sampler learned that the item needs that attribute: solid where it is sure, orange where it is unsure. Each single-attribute item has one solid spoke; each item that combines two attributes has two, mostly orange, and the orange spokes cross where two attributes meet. Each item on the rim is a block zero to three steps deep, one examinee's answer on the ordinal scale, with a faint dot in each empty step. The word ohoegdm is set solid below the wheel.</desc>
